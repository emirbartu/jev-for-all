name: publish

# Every push to main runs the checks, then publishes to npm when package.json's version is new.
# It also mirrors the release to GitHub Packages (scoped name) so the repo's Packages box fills in.
# Auth is npm trusted publishing (OIDC): no token to store. Link it once with
#   npm trust github jev-for-all --file publish.yml --repo emirbartu/jev-for-all -y
on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun scripts/conformance.ts
      - run: bun scripts/sync-adapter-assets.ts --check
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish if this version is not on npm yet
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published, nothing to do"
          else
            # The registry view lags by a minute or two, so a 409 "Cannot publish over" means it is already there.
            npm publish --access public 2>&1 | tee out.log || grep -q "Cannot publish over" out.log
          fi
      - name: Mirror to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          npm pkg set name=@emirbartu/jev-for-all
          echo "//npm.pkg.github.com/:_authToken=$NODE_AUTH_TOKEN" >> "$HOME/.npmrc"
          if npm view "@emirbartu/jev-for-all@$version" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "already on GitHub Packages"
          else
            npm publish --registry=https://npm.pkg.github.com --access public
          fi
