name: publish

# Every push to main runs the checks, then publishes to npm when package.json's version is new.
# It also mirrors the release to GitHub Packages (scoped name) so the repo's Packages box fills in.
# Auth is npm trusted publishing (OIDC): no token to store. Link it once with
#   npm trust github jev-for-all --file publish.yml --repo emirbartu/jev-for-all -y
on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2 # the bundles in adapters/claude-code/dist are built with this; bump both together
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun scripts/conformance.ts
      - run: bun scripts/sync-adapter-assets.ts --check
      - name: Smoke-test the self-contained Claude Code plugin
        run: |
          bun run build
          copy=$(mktemp -d); cp -r adapters/claude-code/. "$copy"
          export XDG_CONFIG_HOME=$(mktemp -d)
          echo '{"hook_event_name":"SessionStart"}' | bun run "$copy/dist/system-one.js"
          test -f "$XDG_CONFIG_HOME/jev-for-all/models.json" && test -f "$XDG_CONFIG_HOME/jev-for-all/config.json"
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | bun run "$copy/dist/delegate.js" | grep -q jev_delegate_light
          git diff --exit-code -- adapters/claude-code/dist adapters/claude-code/browser-mcp || { echo "dist is stale: run 'bun run build' and commit"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish if this version is not on npm yet
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published, nothing to do"
          else
            # The registry view lags by a minute or two, so a 409 "Cannot publish over" means it is already there.
            npm publish --access public 2>&1 | tee out.log || grep -q "Cannot publish over" out.log
          fi
      - name: Mirror to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          npm pkg set name=@emirbartu/jev-for-all
          if npm view "@emirbartu/jev-for-all@$version" version --registry=https://npm.pkg.github.com --//npm.pkg.github.com/:_authToken="$NODE_AUTH_TOKEN" >/dev/null 2>&1; then
            echo "already on GitHub Packages"
          else
            npm publish --registry=https://npm.pkg.github.com --//npm.pkg.github.com/:_authToken="$NODE_AUTH_TOKEN" --access public
          fi
